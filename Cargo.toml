[package]
name = "cosmic-calendar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A calendar for the COSMIC desktop"
repository = "https://github.com/entro314-labs/cosmic-calendar"
rust-version = "1.97.1"

[dependencies]
# --- COSMIC / UI ---
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.12"
open = "5.4"
tokio = { version = "1.53", features = ["full"] }

# --- time ---
# chrono is the domain time type: both `icalendar` and `rrule` are built on it.
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
# jiff appears only at the libcosmic boundary — `widget::calendar` speaks
# `jiff::civil::Date`. Kept in lockstep with the version libcosmic resolves.
jiff = "0.2.35"

# --- iCalendar / recurrence ---
icalendar = { version = "0.17.13", features = ["parser", "chrono-tz", "recurrence"] }
rrule = "0.14"

# --- storage ---
# `bundled` compiles SQLite from source so we never depend on the host's
# libsqlite3 version. Costs ~15s of build time, buys reproducibility.
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
notify = "8.2"

# --- misc ---
uuid = { version = "1.24", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
# Already in the tree via notify-rust's zbus backend. Used directly so the app and
# the reminder daemon can agree on which of them owns notifications.
zbus = "5.18"
# pop-launcher speaks newline-delimited JSON on stdin/stdout.
serde_json = "1"
url = "2.5"

[[bin]]
name = "cosmic-calendar"
path = "src/main.rs"

[[bin]]
name = "cosmic-calendar-applet"
path = "src/bin/applet.rs"

[[bin]]
# Fires reminders with the window closed. Started by a systemd user unit.
name = "cosmic-calendar-daemon"
path = "src/bin/daemon.rs"

[[bin]]
# pop-launcher plugin: searching events from the COSMIC launcher.
name = "cosmic-calendar-launcher"
path = "src/bin/launcher.rs"


[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal",
    # Panel applet support, for the cosmic-calendar-applet binary.
    "applet",
]

[dev-dependencies]
tempfile = "3"

# Uncomment to test against a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
