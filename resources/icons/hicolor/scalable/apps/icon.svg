<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7dd2"/>
      <stop offset="1" stop-color="#1c5fa8"/>
    </linearGradient>
  </defs>

  <!-- page -->
  <rect x="12" y="20" width="104" height="96" rx="14" fill="url(#body)"/>
  <!-- header band -->
  <path d="M12 34a14 14 0 0 1 14-14h76a14 14 0 0 1 14 14v16H12z" fill="url(#header)"/>
  <!-- binder rings -->
  <rect x="36" y="8" width="10" height="26" rx="5" fill="#8b94a3"/>
  <rect x="82" y="8" width="10" height="26" rx="5" fill="#8b94a3"/>

  <!-- grid of days -->
  <g fill="#aab2c0">
    <rect x="28" y="62" width="14" height="12" rx="3"/>
    <rect x="50" y="62" width="14" height="12" rx="3"/>
    <rect x="72" y="62" width="14" height="12" rx="3"/>
    <rect x="94" y="62" width="12" height="12" rx="3"/>

    <rect x="28" y="82" width="14" height="12" rx="3"/>
    <rect x="72" y="82" width="14" height="12" rx="3"/>
    <rect x="94" y="82" width="12" height="12" rx="3"/>

    <rect x="28" y="102" width="14" height="10" rx="3"/>
    <rect x="50" y="102" width="14" height="10" rx="3"/>
    <rect x="72" y="102" width="14" height="10" rx="3"/>
  </g>
  <!-- today marker -->
  <rect x="50" y="82" width="14" height="12" rx="3" fill="#e4572e"/>
</svg>
